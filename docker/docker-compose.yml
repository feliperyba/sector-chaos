name: secto-chaos-neo

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      no_cache: true
    ports:
      - '2567:2567'
    environment:
      - PORT=2567
      - NODE_ENV=development
      - MATCHMAKING_CYCLE_SECONDS=10
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:2567/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client-v3
      no_cache: true
      args:
        VITE_SERVER_URL: ws://localhost:2567
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy
